{% extends "base.html" %}
{% block content %}

<div class="error-page">
  <div class="error-container">
    <div class="error-icon">❌</div>
    <h1>Error</h1>
    <p>{{ message }}</p>
    <a href="/multiplayer" class="btn btn-primary">Back to Challenges</a>
  </div>
</div>

<style>
.error-page {
  min-height: 100vh;
  background: linear-gradient(135deg, #1e3a8a 0%, #2c5282 50%, #34d399 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.error-container {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  max-width: 400px;
}

.error-icon {
  font-size: 64px;
  margin-bottom: 20px;
}

.error-container h1 {
  color: #1f2937;
  font-size: 32px;
  font-weight: 600;
  margin-bottom: 15px;
}

.error-container p {
  color: #374151;
  font-size: 16px;
  margin-bottom: 25px;
}

.btn {
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  display: inline-block;
}

.btn-primary {
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: white;
  box-shadow: 0 4px 15px rgba(59,130,246,0.3);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(59,130,246,0.4);
}
</style>
{% endblock %}
